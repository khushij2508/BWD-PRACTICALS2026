<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Heart</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: #111;
        overflow: hidden;
        perspective: 1000px;
      }

      .scene {
        transform-style: preserve-3d;
        animation: rotate 10s linear infinite;
      }

      .heart {
        position: relative;
        width: 180px;
        height: 180px;
        transform-style: preserve-3d;
        animation: beat 1.2s infinite;
      }

      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 100px;
        height: 160px;
        background: linear-gradient(to bottom, #ff6b81, #ff0033);
        border-radius: 100px 100px 0 0;
        box-shadow: 0 0 30px rgba(255, 0, 70, 0.7);
      }

      .heart::before {
        left: 90px;
        transform: rotate(-45deg);
        transform-origin: 0 100%;
      }

      .heart::after {
        left: 0;
        transform: rotate(45deg);
        transform-origin: 100% 100%;
      }

      .shadow {
        position: absolute;
        width: 220px;
        height: 30px;
        background: rgba(255, 0, 70, 0.25);
        filter: blur(20px);
        border-radius: 50%;
        transform: translateY(140px) rotateX(90deg);
      }

      @keyframes beat {
        0%,
        100% {
          transform: rotateY(0deg) scale(1);
        }
        25% {
          transform: rotateY(15deg) scale(1.08);
        }
        50% {
          transform: rotateY(0deg) scale(1.18);
        }
        75% {
          transform: rotateY(-15deg) scale(1.08);
        }
      }

      @keyframes rotate {
        from {
          transform: rotateY(0deg);
        }
        to {
          transform: rotateY(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="scene">
      <div class="heart"></div>
      <div class="shadow"></div>
    </div>
  </body>
</html>
